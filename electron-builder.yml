appId: com.worldkrafter.app
productName: WorldKrafter
directories:
  output: dist/release
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  target:
    - target: dir
      arch: [x64]
mac:
  target:
    - target: dir
  category: public.app-category.productivity
linux:
  target:
    - target: dir
      arch: [x64]
  category: Utility
