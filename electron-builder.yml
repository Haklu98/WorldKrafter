appId: com.yourname.worldkrafter
productName: WorldKrafter
directories:
  output: dist
files:
  - src/**/*
  - package.json
asar: true
# Native Steam binaries can't load from inside an asar archive.
# Verify this path against the installed steamworks.js version.
asarUnpack:
  - node_modules/steamworks.js/dist/**
# Steam distributes folders of files (depots), not installers, so build
# unpacked directories rather than NSIS/DMG/AppImage.
win:
  target:
    - target: dir
      arch: [x64]
mac:
  target:
    - target: dir
  category: public.app-category.utilities
linux:
  target:
    - target: dir
      arch: [x64]
  category: Utility
